# Package MediaForge source archive + SHA256. Does not auto-promote "stable".
# Trigger: workflow_dispatch or tags matching v*.*.*

name: Release package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: ver
        run: |
          V=$(tr -d '[:space:]' < VERSION)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "MediaForge VERSION=$V"
          test -n "$V"

      - name: Regression smoke
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          bash tests/regression/run.sh

      - name: Build source archive
        run: |
          V="${{ steps.ver.outputs.version }}"
          STAGE="MediaForge-${V}"
          mkdir -p dist "$STAGE"
          # Export tracked files only
          git archive --format=tar --prefix="${STAGE}/" HEAD | tar -xf - -C .
          tar -czf "dist/${STAGE}.tar.gz" "$STAGE"
          (cd dist && sha256sum "${STAGE}.tar.gz" > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mediaforge-source-${{ steps.ver.outputs.version }}
          path: dist/
          retention-days: 30
